<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отель «MARATOVICH» | Бронирование</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html"> MARATOVICH</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="nomera.html">Номера и цены</a></li>
                        <li class="nav-item"><a class="nav-link" href="uslugi.html">Услуги</a></li>
                        <li class="nav-item"><a class="nav-link active" href="bronirovanie.html">Бронирование</a></li>
                        <li class="nav-item"><a class="nav-link" href="kontakty.html">Контакты</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card kartochka-nomera p-4">
                    <h1 class="mb-4 text-center">Онлайн-бронирование номера</h1>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Ваше имя</label>
                            <input type="text" class="form-control" placeholder="Введите ФИО" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Номер телефона</label>
                            <input type="tel" class="form-control" placeholder="+996 (___) __-__" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Дата заезда</label>
                                <input type="date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Дата выезда</label>
                                <input type="date" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Выберите категорию номера</label>
                            <select class="form-select">
                                <option>Стандарт (3500 сом)</option>
                                <option>Комфорт / Полулюкс (5500 сом)</option>
                                <option>Президентский Люкс (12000 сом)</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary w-100 py-2" data-bs-toggle="modal" data-bs-target="#oknoUspexa">
                            Забронировать сейчас
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="oknoUspexa" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Заявка принята!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Спасибо за бронирование! Наш администратор свяжется с вами в течение 10 минут для подтверждения деталей.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Отлично</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="podval-saita text-center">
        <div class="container">
            <p class="mb-0"> Отель «MARATOVICH». Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
